<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ead5ba" />
  <title>Projekt Mascot Playground</title>
</head>
<body>
  <main class="app">
    <section class="stage-wrap">
      <canvas id="mascot-canvas" aria-label="Projekt mascot 3D preview"></canvas>
      <img id="static-fallback" src="%BASE_URL%fallback/mascot-front-v04.png" alt="Projekt mascot" hidden>
    </section>
    <aside class="panel">
      <h1>Projekt Mascot</h1>
      <p>Web prototype v0.4</p>
      <div class="controls">
        <button data-emotion="neutral">Neutral</button>
        <button data-emotion="happy">Happy</button>
        <button data-emotion="excited">Excited</button>
        <button data-emotion="surprised">Surprised</button>
        <button data-emotion="thinking">Thinking</button>
        <button data-emotion="sad">Sad</button>
        <button data-emotion="sleepy">Sleepy</button>
        <button data-emotion="success">Success</button>
        <button data-emotion="focused">Focused</button>
        <button id="move-left">← Move</button>
        <button id="move-right">Move →</button>
        <button id="impulse">Impulse</button>
      </div>
      <label>Slosh <input id="slosh" type="range" min="0" max="2" value="1" step="0.05"></label>
      <label>Damping <input id="damping" type="range" min="0.7" max="0.99" value="0.9" step="0.01"></label>
      <label><input id="reduced-motion" type="checkbox"> Reduced motion</label>
      <pre id="debug"></pre>
    </aside>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
